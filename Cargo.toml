[package]
name = "authzen-pdp"
edition = "2024"
rust-version = "1.97"
version = "0.1.0"
publish = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"

[dependencies]
cedar-local-agent = "3"
cedar-policy = "4.2"

# Async runtime + HTTP server
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal"] }
axum = "0.8"

# Serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Errors, logging
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3            # 最大限の最適化を行う
lto = "fat"              # Link Time Optimization を有効にしてリンク時最適化を強化
codegen-units = 1        # コード生成単位を1にして、インライン化の機会を増やす
strip = "symbols"        # シンボル情報を削除してバイナリサイズを最小化

[profile.dev]
opt-level = 0            # 最適化を最小限にしてコンパイル時間を短縮
debug = true             # デバッグ情報を付与
incremental = true       # インクリメンタルコンパイルを有効化
